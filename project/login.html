<!DOCTYPE html>
<html>
    <head>
        <title>log</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <style>
            *{
                padding:0;
                margin:0;
                box-sizing: border-box;
                font-family: arial;
            }

            body{
                height:100vh;
                display:flex;
                background: url('logcover.jpeg')center/cover no-repeat;
                justify-content: center;
                align-items: center;
            }

            .login{
                width:400px;
                padding:35px;
                border-radius: 20px;
                background: rgba(255,255,255,0.15);
                backdrop-filter:blur(15px);
                -webkit-backdrop-filter: blur(15px);
                border:1px solid rgba(255,255,255,0.2);
                box-shadow:0 8px 32px rgba(0,0,0,0.3);
            }

            .login h2{
                text-align: center;
                color: black;
                margin-bottom: 25px;
                font-size: 30px;
            }

            .inputbox{
                position: relative;
                margin-bottom:18px;
            }

            .inputbox i{
                position: absolute;
                left: 15px;
                top:50%;
                color:#666;
            }

            .inputbox input{
                width:100%;
                padding: 14px 14px 14px 45px;
                border:none;
                outline: none;
                border-radius: 10px;
                background: rgba(255 ,255 ,255,0.9);
                font-size:15px;
            }

            button{
                width:100%;
                padding:14px;
                border:none;
                border-radius:10px;
                background: black;
                color:white;
                font-size:17px;
                font-weight:bold;
            }

            .register{
                text-align: center;
                margin-top: 15px;
                color:#666;
            }

            .register a{
                color:black;
                text-decoration: none;
                font-weight: bold;
            }
        </style>
    </head>

    <body>
        <div class="login">
            <h2>Login</h2>
       

        <form>
            <div class="inputbox">
                <i class="fa-solid fa-user"></i>
                <input type="text" placeholder="User Name" required>
            </div>
          
            <div class="inputbox">
               <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Password" required>
            </div>

            <button type="submit" onclick="showpopup()">Login</button>
         

            <div class="register">
                Don't Have an account? <a href="register.html">Register</a>
            </div>
        </form>
        </div>


        <script>
            function showpopup(){
                alert("Login Successfully !");

                window.location.href="project.html";
            }

            
        </script>
    </body>
</html>
